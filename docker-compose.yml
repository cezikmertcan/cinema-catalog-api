name: cinema-catalog-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/cinema_catalog
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: local-development-secret-change-before-production
      AUTH_JWT_ISSUER: cinema-catalog-api
      AUTH_JWT_AUDIENCE: cinema-catalog-api-client
      AUTH_ACCESS_TOKEN_TTL_SECONDS: 900
      AUTH_REFRESH_TOKEN_TTL_SECONDS: 2592000
      AUTH_REDIS_PREFIX: cinema-catalog:auth
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: cinema_catalog
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" --host localhost | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
